name: To Production Workflow
run-name: Mering To Master 🚀
on:
  push:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run Linter
        run: make check

  test:
    runs-on: ubuntu-latest
    needs: lint
    if: success()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -race ./...

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    env:
      HAS_DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Generate templ code
        run: make gen

      - name: Build Server Binary
        run: GOOS=openbsd GOARCH=amd64 go build -o server .
  
      # Forks/projects created from this template deploy once SSH_HOST, SSH_USER,
      # and SSH_PRIVATE_KEY are set. Without them the build runs and the copy/restart steps are skipped.
      - name: Copy app files to server
        if: success() && env.HAS_DEPLOY_KEY == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "server,static/*"
          target: /var/www/

      # Same gate as the copy step above.
      - name: Launch new binary
        if: success() && env.HAS_DEPLOY_KEY == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: rcctl stop appd && rcctl start appd

